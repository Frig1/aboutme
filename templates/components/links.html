{% macro text(href, label) %}
<a class="group relative inline-flex w-fit items-center gap-2" href="{{ href }}">
  <span class="pb-0.5 text-sm after:absolute after:inset-x-0 after:bottom-0 after:h-px after:origin-right after:scale-x-0 after:bg-current after:transition-transform after:duration-200 group-hover:after:origin-left group-hover:after:scale-x-100 group-focus-visible:after:origin-left group-focus-visible:after:scale-x-100">{{ label }}</span>
  <span class="text-accent" aria-hidden="true">↗</span>
</a>
{% endmacro %}

{% macro project(href, label) %}
<a class="group relative mt-4 inline-flex w-fit items-center gap-2 font-mono text-xs" href="{{ href }}" target="_blank" rel="noreferrer">
  <span class="pb-0.5 after:absolute after:inset-x-0 after:bottom-0 after:h-px after:origin-right after:scale-x-0 after:bg-current after:transition-transform after:duration-200 group-hover:after:origin-left group-hover:after:scale-x-100 group-focus-visible:after:origin-left group-focus-visible:after:scale-x-100">{{ label }}</span>
  <span class="text-accent" aria-hidden="true">↗</span>
</a>
{% endmacro %}
